<!doctype html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HateWatch Syria</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Icon sprite: the shield-and-alert mark (logo) plus the two alert-type glyphs, drawn once
       here and reused with <use href="#i-name">, same convention as ../field-app/index.html. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 32 32">
        <path d="M16 2.5 L27 6.5 V15 C27 21.5 22.5 26.5 16 29.5 C9.5 26.5 5 21.5 5 15 V6.5 Z"
              fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
        <circle cx="22.5" cy="21.5" r="6.2" fill="#e07a1f"/>
        <rect x="21.6" y="18.2" width="1.8" height="4.6" rx="0.9" fill="#fff"/>
        <circle cx="22.5" cy="24.4" r="1" fill="#fff"/>
      </symbol>
      <!-- spike: a sudden, stepped jump -->
      <symbol id="i-spike" viewBox="0 0 24 24">
        <rect x="3.5" y="15" width="3.4" height="6" rx="1" fill="currentColor"/>
        <rect x="10.3" y="10" width="3.4" height="11" rx="1" fill="currentColor"/>
        <rect x="17.1" y="3" width="3.4" height="18" rx="1" fill="currentColor"/>
      </symbol>
      <!-- slow burn: one continuous gradual rise, no single jump -->
      <symbol id="i-slowburn" viewBox="0 0 24 24">
        <path d="M2 19c4-1 6-4 8-7s6-7 12-9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar-title">
      <svg class="topbar-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-logo"/></svg>
      <div>
        <h1 id="app-title">HateWatch Syria</h1>
        <p id="app-subtitle" class="subtitle">Early-warning dashboard</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="last-updated" class="last-updated"></span>
      <button id="staff-toggle" class="btn btn-ghost">
        <span id="staff-toggle-label">Staff reporting</span>
        <span id="staff-badge" class="badge-count" hidden>0</span>
      </button>
      <button id="lang-toggle" class="btn btn-ghost">العربية</button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="main-grid">

    <!-- ---- LEFT (in RTL becomes right): alerts list ---- -->
    <section class="panel alerts-panel">
      <h2 id="alerts-heading">Alerts</h2>
      <div id="alerts-list" class="alerts-list">
        <!-- alert cards injected by app.js -->
      </div>
      <p id="no-alerts" class="empty-note" hidden>No unusual activity right now.</p>
    </section>

    <!-- ---- RIGHT: map ---- -->
    <section class="panel map-panel">
      <h2 id="map-heading">Map</h2>
      <div id="map"></div>
      <div class="legend">
        <span class="legend-item"><span class="dot dot-red"></span><span id="legend-urgent">Urgent</span></span>
        <span class="legend-item"><span class="dot dot-orange"></span><span id="legend-warning">Warning</span></span>
        <span class="legend-item"><span class="dot dot-yellow"></span><span id="legend-watch">Watch</span></span>
      </div>
    </section>

  </main>

  <!-- ============ COMMUNITY INPUT (bottom, always visible) ============ -->
  <section class="panel input-panel">
    <div class="input-col">
      <h3 id="add-keyword-heading">Add a new word or phrase</h3>
      <form id="keyword-form" class="inline-form">
        <input id="keyword-input" type="text" required
               placeholder="Type a word people are using..." autocomplete="off" />
        <button type="submit" class="btn btn-primary" id="keyword-submit">Add</button>
      </form>
      <p id="add-keyword-note" class="hint">Added to the list below right away.</p>
      <button id="toggle-keyword-list" class="btn btn-ghost btn-small" type="button" data-open="0">Show current keyword list</button>
      <div id="keyword-list" class="chip-list term-list" hidden></div>
    </div>

    <div class="input-col">
      <h3 id="add-source-heading">Add a website or channel to watch</h3>
      <form id="source-form" class="inline-form">
        <input id="source-input" type="text" required
               placeholder="Paste a link or channel name..." autocomplete="off" />
        <button type="submit" class="btn btn-primary" id="source-submit">Add</button>
      </form>
      <div id="source-pending" class="chip-list"></div>
    </div>

    <div class="input-col">
      <h3 id="add-event-heading">Report event</h3>
      <!-- Same event types and same place list (governorate/district) as the field app's
           "Report an event" screen (see ../field-app/), so the two feed events.csv the same way. -->
      <form id="event-form" class="inline-form inline-form-stacked">
        <select id="event-type-select" required></select>
        <input id="event-type-other-input" type="text" autocomplete="off" hidden />
        <input id="event-desc-input" type="text" required
               placeholder="What happened..." autocomplete="off" />
        <input id="event-date-input" type="date" required />
        <select id="event-place-select" class="place-select" required></select>
        <input id="event-neighbourhood-input" type="text" autocomplete="off" />
        <button type="submit" class="btn btn-primary" id="event-submit">Add</button>
      </form>
      <div id="event-pending" class="chip-list"></div>
    </div>
  </section>

  <footer class="footer">
    <p id="no-action-note">This dashboard does not tell you what to do — you decide.</p>
  </footer>

  <!-- ============ DETAIL PANEL (slide-over) ============ -->
  <div id="overlay" class="overlay" hidden></div>
  <aside id="detail-panel" class="detail-panel" hidden>
    <button id="detail-close" class="btn btn-ghost detail-close">✕ <span id="close-label">Close</span></button>
    <h2 id="detail-title"></h2>
    <p id="detail-level-badge" class="badge"></p>
    <p id="detail-sentence" class="detail-sentence"></p>
    <p id="detail-stat" class="detail-stat"></p>
    <p id="detail-event" class="detail-event" hidden></p>
    <div class="chart-wrap"><canvas id="detail-chart"></canvas></div>
  </aside>

  <!-- ============ STAFF REPORTING (slide-over) ============ -->
  <!-- Reads field-app submissions straight out of localStorage (key hatewatch_field_submissions) —
       shared with ../field-app/ only when both are served from the same origin, see dashboard/README.md. -->
  <div id="staff-overlay" class="overlay" hidden></div>
  <aside id="staff-panel" class="detail-panel staff-panel" hidden>
    <button id="staff-panel-close" class="btn btn-ghost detail-close">✕ <span id="staff-close-label">Close</span></button>
    <h2 id="staff-heading">Staff reporting</h2>
    <div id="staff-body"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
